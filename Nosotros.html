
<!DOCTYPE html>
<html>
<head>
    <title>Mi regalo ❤️</title>
<style>
body {
    background-color: red;
    background-image:
        radial-gradient(circle, black 12px, transparent 13px),
        radial-gradient(circle, black 12px, transparent 13px);
    background-size: 90px 90px;
    background-position: 0 0, 40px 50px;
}

h1, p {
    background-color: white;
    width: fit-content;
    margin: 20px auto;
    padding: 8px 15px;
    border-radius: 20px;
}
</style>

</head>

<body style="background-color: red; background-image: radial-gradient(circle, black 12px, transparent 13px), radial-gradient(circle, black 12px, transparent 13px); background-size: 90px 90px; background-position: 0 0, 40px 50px; text-align: center; background-attachment: fixed;">

<h1 style="color: purple; text-align: center; font-size: 42px; background-color: white; width: fit-content; margin: 20px auto;">
    Nuestros recuerdos ❤️
</h1>

<h2 style="background-color: white; width: fit-content; margin: 25px auto; padding: 10px 20px; border-radius: 15px;">
    📸 Nuestros momentos juntos
</h2>

<img
    src="Foto16.jpg.jpeg"
    alt="Nuestro recuerdo"
    style="width: 250px; border-radius: 20px; display: block; cursor: pointer;"
    onclick="document.getElementById('fotoGrande').style.display='flex'"
>

<div id="fotoGrande" style="
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-color: rgba(0,0,0,0.95);
    justify-content: center;
    align-items: center;
    z-index: 9999;
"
onclick="this.style.display='none'">

    <span style="
        position: absolute;
        top: 15px;
        right: 25px;
        color: white;
        font-size: 45px;
        cursor: pointer;
    ">&times;</span>

    <img
        src="Foto16.jpg.jpeg"
        alt="Nuestro recuerdo ampliado"
        style="max-width: 95%; max-height: 90%; object-fit: contain; border-radius: 10px;"
    >

</div>
<img src="D:\los doas.jpg.jpeg" alt="Otro recuerdo nuestro"
style="width: 250px; border-radius: 20px; cursor: pointer; margin: 10px;">
<p style="background-color: white; width: fit-content; margin: 20px auto;">
    No sabes cuanto te amo.
</p>

</body>
</html>
